# Used inside the official nginx image. The same dist works at / and /tools/formatter/.
map $uri $formatter_cache {
    default "no-cache";
    ~^/(tools/formatter/)?assets/ "public, max-age=31536000, immutable";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    etag on;

    # Log paths only, excluding query strings. Input never appears in a URL.
    access_log off;
    add_header Cache-Control $formatter_cache;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # CodeMirror uses inline style attributes and inserts styles at runtime.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ =404; }
    location = /tools/formatter { return 308 /tools/formatter/; }
    location /tools/formatter/ { alias /usr/share/nginx/html/; }
}
